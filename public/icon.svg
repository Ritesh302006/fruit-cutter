<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rindGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="fleshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="85%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#312e81" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Fruit Part: Watermelon Slice (Cut apart) -->
  <!-- Top Half (flying up-left) -->
  <g transform="translate(-18, -24) rotate(-14 256 256)">
    <path d="M 120 256 A 140 140 0 0 1 392 256 Z" fill="url(#rindGrad)"/>
    <path d="M 132 256 A 128 128 0 0 1 380 256 Z" fill="#fef08a"/>
    <path d="M 142 256 A 118 118 0 0 1 370 256 Z" fill="url(#fleshGrad)"/>
    <!-- Seeds -->
    <ellipse cx="200" cy="225" rx="5" ry="9" fill="#18181b" transform="rotate(-25 200 225)"/>
    <ellipse cx="256" cy="205" rx="5" ry="9" fill="#18181b"/>
    <ellipse cx="312" cy="225" rx="5" ry="9" fill="#18181b" transform="rotate(25 312 225)"/>
    <ellipse cx="230" cy="240" rx="4" ry="7" fill="#18181b" transform="rotate(-15 230 240)"/>
    <ellipse cx="282" cy="240" rx="4" ry="7" fill="#18181b" transform="rotate(15 282 240)"/>
  </g>

  <!-- Bottom Half (flying down-right) -->
  <g transform="translate(24, 30) rotate(16 256 256)">
    <path d="M 120 256 A 140 140 0 0 0 392 256 Z" fill="url(#rindGrad)"/>
    <path d="M 132 256 A 128 128 0 0 0 380 256 Z" fill="#fef08a"/>
    <path d="M 142 256 A 118 118 0 0 0 370 256 Z" fill="url(#fleshGrad)"/>
    <!-- Seeds -->
    <ellipse cx="205" cy="285" rx="5" ry="9" fill="#18181b" transform="rotate(25 205 285)"/>
    <ellipse cx="256" cy="305" rx="5" ry="9" fill="#18181b"/>
    <ellipse cx="307" cy="285" rx="5" ry="9" fill="#18181b" transform="rotate(-25 307 285)"/>
  </g>

  <!-- Juice Splashes -->
  <circle cx="170" cy="180" r="10" fill="#f43f5e" opacity="0.9"/>
  <circle cx="345" cy="190" r="8" fill="#f43f5e" opacity="0.9"/>
  <circle cx="360" cy="330" r="12" fill="#f43f5e" opacity="0.9"/>
  <circle cx="150" cy="320" r="9" fill="#f43f5e" opacity="0.9"/>
  <circle cx="210" cy="140" r="6" fill="#f43f5e" opacity="0.8"/>
  <circle cx="310" cy="370" r="7" fill="#f43f5e" opacity="0.8"/>

  <!-- Glowing Katana / Slicing Trail -->
  <path d="M 50 390 Q 240 260 460 120" fill="none" stroke="url(#bladeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 70 380 Q 245 255 440 130" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Sparkle Stars -->
  <polygon points="256,236 261,251 276,256 261,261 256,276 251,261 236,256 251,251" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="380,150 383,160 393,163 383,166 380,176 377,166 367,163 377,160" fill="#fef08a"/>
</svg>
